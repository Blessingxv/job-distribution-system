name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workflowtest
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_job_dist_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create database tables
        run: python -m models.create_model
        env:
          DATABASE_URL: postgresql://workflowtest:testpassword@localhost:5432/test_job_dist_db
      - name: Run tests
        run: pytest tests/ -v
        env:
            DATABASE_URL: postgresql://workflowtest:testpassword@localhost:5432/test_job_dist_db
        
